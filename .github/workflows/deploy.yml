name: Build and deploy to Pages

# Собирает дашборд (build.py тянет живые данные CoinGecko) и публикует в GitHub Pages.
# Ежечасно обновляет данные + при каждом пуше в main.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"      # ежечасно — свежие данные
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build site
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
