name: Protect main (cron-safe)

# Включает защиту ветки main так, чтобы КРОН НЕ СЛОМАЛСЯ:
#   • запрет force-push и удаления ветки, правила на админов (enforce_admins);
#   • БЕЗ required_pull_request_reviews и required_status_checks — иначе прямой push keepalive/deploy отклонится.
# Пишет protect-result.json (результат PUT) для внешней проверки. Использует секрет GH_PAT (admin-доступ).

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/protect.yml']

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Apply branch protection + report
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/branches/main/protection" \
            -d '{
              "required_status_checks": null,
              "enforce_admins": true,
              "required_pull_request_reviews": null,
              "restrictions": null,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "required_conversation_resolution": false,
              "lock_branch": false,
              "block_creations": false
            }')
          echo "HTTP $code"; cat /tmp/resp.json
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ "$code" = "200" ]; then EN=true; else EN=false; fi
          printf '{"ts":"%s","protection_http":"%s","enabled":%s}\n' "$TS" "$code" "$EN" > protect-result.json
          git config user.name "protect-bot"
          git config user.email "protect-bot@users.noreply.github.com"
          git add protect-result.json
          git commit -m "ci: protection result [skip ci]" || echo "нет изменений"
          git push
          if [ "$code" = "200" ]; then
            echo "✅ Защита включена (force-push/удаление запрещены, админы включены, PR НЕ требуется — крон работает)."
          else
            echo "❌ HTTP $code — у GH_PAT нет admin-прав (classic: scope repo; fine-grained: Administration: write)."
            exit 1
          fi
