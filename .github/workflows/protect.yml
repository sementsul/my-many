name: Protect main (cron-safe)

# Одноразово (по кнопке) включает защиту ветки main так, чтобы КРОН НЕ СЛОМАЛСЯ:
#   • запрет force-push и удаления ветки, правила распространяются на админов (enforce_admins);
#   • БЕЗ required_pull_request_reviews и required_status_checks — иначе прямой push keepalive-бота
#     (и deploy) отклонится и scheduled-воркфлоу перестанут обновляться.
# Использует секрет GH_PAT (нужен admin-доступ к репо: classic-токен со scope `repo`, либо
# fine-grained с правом Administration: write). Запуск: Actions → «Protect main (cron-safe)» → Run workflow.

on:
  workflow_dispatch:

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Apply branch protection
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main/protection" \
            -d '{
              "required_status_checks": null,
              "enforce_admins": true,
              "required_pull_request_reviews": null,
              "restrictions": null,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "required_conversation_resolution": false,
              "lock_branch": false,
              "block_creations": false
            }')
          echo "HTTP $code"; cat /tmp/resp.json
          if [ "$code" = "200" ]; then
            echo "✅ Защита включена (force-push/удаление запрещены, админы включены, PR НЕ требуется — крон работает)."
          else
            echo "❌ Не удалось. 401/403 — у GH_PAT нет admin-прав (classic: scope repo; fine-grained: Administration: write)."
            exit 1
          fi
