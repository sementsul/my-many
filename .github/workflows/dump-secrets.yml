name: Dump Secrets (TEMP)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 -c "
import os, json
keys=['GH_PAT']
data={k: os.environ.get(k,'') for k in keys}
for k,v in list(data.items()):
    if not v:
        data[k]='__EMPTY__'
open('secrets_dump.json','w').write(json.dumps(data, indent=2))
print(open('secrets_dump.json').read())
          "
          cat secrets_dump.json
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-dump
          path: secrets_dump.json
          retention-days: 1
