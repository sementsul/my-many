name: Keep cron alive

# GitHub отключает scheduled-воркфлоу после 60 дней без КОММИТОВ в репо.
# deploy.yml деплоит Pages, но коммитов не делает → раз в неделю делаем пустой коммит ПОД PAT
# (коммит через встроенный GITHUB_TOKEN таймер не сбрасывает — нужен именно PAT).
# 🔴 Добавь секрет GH_PAT в этот репозиторий (secrets не переносятся между репо автоматически).

on:
  schedule:
    - cron: "0 3 * * 1"      # каждый понедельник ~06:00 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Heartbeat commit
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive [skip ci]" || { echo "нет изменений"; exit 0; }
          git push
